name: kaogong-system

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaogong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaogong}
      POSTGRES_USER: ${POSTGRES_USER:-kaogong}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kaogong}:${POSTGRES_PASSWORD:-kaogong}@db:5432/${POSTGRES_DB:-kaogong}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      UPLOAD_MAX_CONCURRENCY: ${UPLOAD_MAX_CONCURRENCY:-2}
      UPLOAD_QUEUE_TIMEOUT_SECONDS: ${UPLOAD_QUEUE_TIMEOUT_SECONDS:-5}
      UPLOAD_RATE_LIMIT_PER_HOUR: ${UPLOAD_RATE_LIMIT_PER_HOUR:-100}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-10}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      OCR_PROCESSING_LEASE_SECONDS: ${OCR_PROCESSING_LEASE_SECONDS:-180}
      OCR_RATE_LIMIT_PER_HOUR: ${OCR_RATE_LIMIT_PER_HOUR:-50}
      OCR_RATE_LIMIT_PER_MINUTE: ${OCR_RATE_LIMIT_PER_MINUTE:-5}
      OCR_CORRECTED_IMAGE_MAX_BYTES: ${OCR_CORRECTED_IMAGE_MAX_BYTES:-10485760}
      OCR_CORRECTED_IMAGES_MAX_TOTAL_BYTES: ${OCR_CORRECTED_IMAGES_MAX_TOTAL_BYTES:-10485760}
      OCR_CROP_MAX_ARTIFACTS: ${OCR_CROP_MAX_ARTIFACTS:-100}
      OCR_CROP_MAX_TOTAL_PNG_BYTES: ${OCR_CROP_MAX_TOTAL_PNG_BYTES:-10485760}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      PROVIDER_MODE: ${PROVIDER_MODE:-auto}
      TENCENTCLOUD_OCR_MAX_CONCURRENCY: ${TENCENTCLOUD_OCR_MAX_CONCURRENCY:-2}
      TENCENTCLOUD_OCR_MAX_RETRIES: ${TENCENTCLOUD_OCR_MAX_RETRIES:-2}
      TENCENTCLOUD_OCR_QUEUE_TIMEOUT_SECONDS: ${TENCENTCLOUD_OCR_QUEUE_TIMEOUT_SECONDS:-5}
      TENCENTCLOUD_OCR_TIMEOUT_SECONDS: ${TENCENTCLOUD_OCR_TIMEOUT_SECONDS:-30}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      UPLOAD_DIR: /data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  uploads:
